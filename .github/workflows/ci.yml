name: Kalshi CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  proof:
    name: Kalshi proof suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          ACCOUNT_SIZE=5000
          # Risk constants are pinned explicitly so the gate never proves a
          # different risk posture than production by falling back to defaults.
          KALSHI_MAX_CONCURRENT_POSITIONS=20
          KALSHI_SAME_EVENT_FAMILY_CAP=5
          EV_THRESHOLD=0.120
          KALSHI_HUB_EXPOSURE_PCT=0.30
          KALSHI_HUB_EXPOSURE_MIN_USD=12
          KALSHI_MAX_USD_PER_POSITION=10.0
          KALSHI_HIGH_PROB_THRESHOLD=0.80
          KALSHI_ULTRA_HIGH_PROB_THRESHOLD=0.90
          KALSHI_HIGH_PROB_POSITION_CAP_MULTIPLIER=1.50
          KALSHI_ULTRA_HIGH_PROB_POSITION_CAP_MULTIPLIER=2.00
          KALSHI_ULTRA_HIGH_PROB_NO_CONCURRENT_BONUS=2
          KALSHI_ULTRA_HIGH_PROB_NO_FAMILY_CAP_BONUS=1
          SALVAGE_EXIT_DELTA=0.15
          SALVAGE_EXIT_DELTA_HIGH_PROB=0.12
          SALVAGE_EXIT_DELTA_ULTRA_HIGH_PROB=0.10
          FORECAST_LANE_ACTIVE=true
          FORECAST_AUTONOMOUS_ENABLED=true
          KALSHI_API_KEY_ID=test_key_ci
          KALSHI_PRIVATE_KEY_PATH=kalshi_private_key.pem
          TELEGRAM_BOT_TOKEN=test_token
          TELEGRAM_CHAT_ID=123456
          GOOGLE_API_KEY=test_google_key
          EOF
          : > kalshi_private_key.pem
          chmod 600 kalshi_private_key.pem

      - name: Lint with ruff (non-blocking)
        run: |
          ruff check . \
            --exclude=".git,__pycache__,logs" \
            --ignore=E501,E402,F401,F811,W503 \
            --select=E,F,W \
            || true

      - name: Boundary contract audit
        run: |
          python scripts/contract_audit.py --strict

      - name: Run Kalshi proof gate
        run: |
          python -m pytest tests/proof \
            --tb=long \
            --no-header \
            -q

      - name: Live Kalshi schema probe
        run: |
          python scripts/kalshi_schema_probe.py

      - name: Shadow execution dry-run (sniper cron)
        run: |
          export SHADOW_EXECUTION=true
          python sniper_cron.py

      - name: Validate config
        run: |
          python scripts/validate.py

      - name: Repo truth gate (strict)
        run: |
          python scripts/repo_truth_gate.py --strict
