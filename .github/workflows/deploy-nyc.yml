name: Protected NYC Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm protected deploy to NYC production"
        required: true
        type: boolean
        default: false
  workflow_run:
    workflows: ["Kalshi CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: nyc-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Protected deploy to NYC
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_production == 'true') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       vars.NYC_AUTO_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment:
      name: nyc-production

    steps:
      - name: Resolve deploy ref
        id: plan
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            echo "deploy_ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "deploy_mode=auto-after-ci" >> "$GITHUB_OUTPUT"
            echo "deploy_reason=Kalshi CI succeeded on master and NYC_AUTO_DEPLOY_ENABLED=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_ref=master" >> "$GITHUB_OUTPUT"
            echo "deploy_mode=manual-dispatch" >> "$GITHUB_OUTPUT"
            echo "deploy_reason=Manual protected dispatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deploy ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.plan.outputs.deploy_ref }}

      - name: Assert deploy secret exists
        run: |
          if [ -z "${{ secrets.NYC_SSH_PRIVATE_KEY }}" ]; then
            echo "Missing NYC_SSH_PRIVATE_KEY secret on the nyc-production environment."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install proof and deploy dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Create test .env for validation
        run: |
          cat > .env << 'EOF'
          ACCOUNT_SIZE=5000
          # Risk constants are pinned explicitly so the gate never proves a
          # different risk posture than production by falling back to defaults.
          KALSHI_MAX_DEPLOYED_PCT=0.90
          KALSHI_MAX_CONCURRENT_POSITIONS=20
          KALSHI_SAME_EVENT_FAMILY_CAP=5
          EV_THRESHOLD=0.120
          KALSHI_HUB_EXPOSURE_PCT=0.40
          KALSHI_HUB_EXPOSURE_MIN_USD=20
          KALSHI_MAX_QTY_PER_POSITION=15
          KALSHI_MAX_USD_PER_POSITION=10.0
          KALSHI_MIN_ENTRY_PRICE=0.34
          KALSHI_KELLY_CAP=0.12
          KALSHI_KELLY_FRACTION=0.25
          KALSHI_MAX_RISK_PER_EVENT_PCT=0.08
          KALSHI_MAX_ENTRY_SLIPPAGE=0.02
          KALSHI_POSITION_SNAPSHOT_MAX_AGE_SEC=60
          KALSHI_MIN_MODEL_HEADROOM_F=2.0
          METAR_TREND_MAX_AGE_SEC=5400
          CITY_BLACKLIST=ABQ,CHS,CLT,DC,DET,LV,MCI,MCO,MKE,MSP,OMA,PDX,PHL,PHX,RDU,SLC,STL
          KALSHI_HIGH_PROB_THRESHOLD=0.80
          KALSHI_ULTRA_HIGH_PROB_THRESHOLD=0.90
          KALSHI_HIGH_PROB_POSITION_CAP_MULTIPLIER=1.50
          KALSHI_ULTRA_HIGH_PROB_POSITION_CAP_MULTIPLIER=2.00
          KALSHI_ULTRA_HIGH_PROB_NO_CONCURRENT_BONUS=2
          KALSHI_ULTRA_HIGH_PROB_NO_FAMILY_CAP_BONUS=1
          SALVAGE_EXIT_DELTA=0.15
          SALVAGE_EXIT_DELTA_HIGH_PROB=0.12
          SALVAGE_EXIT_DELTA_ULTRA_HIGH_PROB=0.10
          RBI_MIN_DAYS=7
          RBI_MIN_NEW_CLEAN_TRADES=24
          RBI_LEARNING_EPOCH=v19.20.0-deterministic-physics-path
          FORECAST_LANE_ACTIVE=true
          FORECAST_AUTONOMOUS_ENABLED=true
          KALSHI_API_KEY_ID=test_key_ci
          KALSHI_PRIVATE_KEY_PATH=kalshi_private_key.pem
          TELEGRAM_BOT_TOKEN=test_token
          TELEGRAM_CHAT_ID=123456
          GOOGLE_API_KEY=test_google_key
          EOF
          : > kalshi_private_key.pem
          chmod 600 kalshi_private_key.pem

      - name: Boundary contract audit
        run: |
          python scripts/contract_audit.py --strict

      - name: Lint production trading boundaries (blocking)
        run: |
          ruff check \
            config.py \
            forecast/covariance_engine.py \
            forecast/db.py \
            forecast/runner.py \
            forecast/strategy_engine.py \
            data/kalshi_weather_monitor.py \
            dashboard/jarvis_brain.py \
            execution/kalshi_execution_controller.py \
            runtime/operator_truth.py \
            runtime/sentinel.py \
            scripts/watchdog.py \
            scripts/backfill_station_history.py \
            notifications/telegram_bot.py \
            --ignore=E501,E402,F401,F811 \
            --select=E,F,W

      - name: Kalshi proof gate
        run: |
          python -m pytest tests/proof \
            --tb=long \
            --no-header \
            -q

      - name: Live Kalshi schema probe
        run: |
          python scripts/kalshi_schema_probe.py

      - name: Shadow execution dry-run (sniper cron)
        run: |
          export SHADOW_EXECUTION=true
          python sniper_cron.py

      - name: Validate config
        run: |
          python scripts/validate.py

      - name: Repo truth gate (strict)
        run: |
          python scripts/repo_truth_gate.py --strict

      - name: Load production SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NYC_SSH_PRIVATE_KEY }}

      - name: Seed known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 157.245.15.40 >> ~/.ssh/known_hosts

      - name: Preflight remote reachability
        run: |
          ssh -o BatchMode=yes -p 2222 algo-runner@157.245.15.40 'echo NYC preflight OK'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image repo
        id: img
        run: echo "repo=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Building on GitHub's runners (many cores, layer caching) instead of the
      # droplet's 2 cores cuts this step from ~40 minutes to a few. deploy.sh
      # then just pulls the SHA-tagged image already sitting in GHCR.
      - name: Build & push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.img.outputs.repo }}:${{ github.sha }}
            ${{ steps.img.outputs.repo }}:latest

      - name: Build & push cockpit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          build-args: BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
          tags: |
            ${{ steps.img.outputs.repo }}-dashboard:${{ github.sha }}
            ${{ steps.img.outputs.repo }}-dashboard:latest

      - name: Deploy exact authored SHA
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Verify deployed SHA and services
        run: |
          EXPECTED_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(ssh -o BatchMode=yes -p 2222 algo-runner@157.245.15.40 "awk -F= '/^sha=/{print \$2}' /home/algo-runner/bot/version.txt")"
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "Remote SHA mismatch: expected $EXPECTED_SHA got $REMOTE_SHA"
            exit 1
          fi
          ssh -o BatchMode=yes -p 2222 algo-runner@157.245.15.40 '
            docker ps --format "{{.Names}} {{.Status}}" | grep "execution-engine" | grep "Up"
            docker ps --format "{{.Names}} {{.Status}}" | grep "kalshi-cockpit" | grep "Up"
          '

      - name: Deployment summary
        run: |
          {
            echo "## Protected NYC Deploy"
            echo ""
            echo "- Mode: \`${{ steps.plan.outputs.deploy_mode }}\`"
            echo "- Reason: ${{ steps.plan.outputs.deploy_reason }}"
            echo "- SHA: \`$(git rev-parse HEAD)\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Environment: \`nyc-production\`"
          } >> "$GITHUB_STEP_SUMMARY"
